plugins { id 'com.android.application' }
android {
    namespace 'com.danzcollective.photos'
    compileSdk 36
    defaultConfig {
        applicationId 'com.danzcollective.photos'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0-pilot'
        // Public identifier, never an access token or client secret.
        def metaId = providers.gradleProperty('DANZ_META_APP_ID').getOrElse('')
        if (!(metaId ==~ /[0-9]*/)) throw new GradleException('DANZ_META_APP_ID must be a numeric public application ID')
        buildConfigField 'String', 'META_APP_ID', '"' + metaId + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
