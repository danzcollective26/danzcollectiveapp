name: Verify DANZ

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: danz-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - name: Check arcade controls first
        run: npm run test:e2e -- tests/e2e/groove.spec.ts tests/e2e/snake.spec.ts --workers=2 --max-failures=1
      - run: npm run test:e2e -- --workers=2 --max-failures=3
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-pwa-report/
          retention-days: 7
