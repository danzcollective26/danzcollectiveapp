name: Verify DANZ

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: danz-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - name: Upload offline test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa-report
          path: playwright-pwa-report/
          retention-days: 7
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, tablet, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify passport immersive navigation contract
        run: npm run test:e2e -- tests/e2e/passport-immersive-contract.spec.ts tests/e2e/member-wallet-contract.spec.ts tests/e2e/passport-stamps-immersive.spec.ts --project=${{ matrix.viewport }} --workers=1
      - run: npm run test:e2e -- --project=${{ matrix.viewport }} --workers=2 --max-failures=5
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.viewport }}-report
          path: playwright-report/
          retention-days: 7
