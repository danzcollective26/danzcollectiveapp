name: Verify photo viewer on mobile

on:
  pull_request:
    paths:
      - 'src/cloud/PrivateGallery.css'
      - 'src/ui/MobileBottomNav.css'
      - 'src/admin/AlbumPhotoViewer.tsx'
      - 'tests/e2e/gallery-admin.spec.ts'
      - '.github/workflows/verify-photo-viewer.yml'
  workflow_dispatch:

concurrency:
  group: danz-photo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-photo-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test original download, Save As and Instagram guidance
        run: npm run test:e2e -- --project=mobile --workers=1 --max-failures=3 tests/e2e/gallery-admin.spec.ts --grep 'Save As'
      - name: Upload mobile photo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-viewer-mobile-report
          path: playwright-report/
          retention-days: 7
