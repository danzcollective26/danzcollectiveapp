name: Verify Groove Ninja

on:
  pull_request:
    paths:
      - 'src/arcade/groove.ts'
      - 'src/arcade/GrooveNinja.tsx'
      - 'tests/groove.test.ts'
      - 'tests/e2e/groove.spec.ts'
      - '.github/workflows/verify-groove.yml'
  workflow_dispatch:

concurrency:
  group: danz-groove-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  groove-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Exercise all Groove Ninja modes and gestures on mobile
        run: npm run test:e2e -- --project=mobile --workers=1 tests/e2e/groove.spec.ts
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groove-mobile-report
          path: playwright-report/
          retention-days: 7
