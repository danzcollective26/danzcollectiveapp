name: Verify DANZPORTER multitouch

on:
  pull_request:
    paths:
      - 'src/arcade/kart/KartController.tsx'
      - 'tests/e2e/kart.spec.ts'
      - '.github/workflows/verify-kart-multitouch.yml'
  workflow_dispatch:

concurrency:
  group: danz-pedals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-multitouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test real two-finger pedal ownership and driving
        run: npm run test:e2e -- --project=mobile --workers=1 tests/e2e/kart.spec.ts
      - name: Upload mobile trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danzporter-multitouch
          path: playwright-report/
          retention-days: 7
