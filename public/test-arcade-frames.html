<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANZ · revisión de marcos</title>
<style>*{box-sizing:border-box}body{margin:20px;background:#11181e;color:#eee;font:14px system-ui}form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}select,button{min-height:44px;padding:8px;background:#25363c;color:#fff;border:1px solid #809489}iframe{display:block;box-sizing:content-box;border:1px solid #536e77;max-width:none;background:#111}h1{font-size:22px}p{max-width:75ch;line-height:1.5;color:#becac7}</style>
<h1>Revisión de marcos del Arcade</h1><p>Juego real en una ventana de tamaño fijo, con pantalla completa desactivada dentro de la ventana. Esta revisión visual no sustituye una prueba de teléfono físico.</p>
<form><label>Juego <select name="game" aria-label="Juego"><option value="jack">Jack</option><option value="groove">Groove</option><option value="arena">Arena 1vs1</option><option value="solo">Último turno</option><option value="chase">Persecución</option></select></label><label>Tamaño <select name="size" aria-label="Tamaño"><option value="phone">390 × 844</option><option value="compact">320 × 568</option><option value="wide">844 × 390</option></select></label><button>VER</button></form>
<iframe title="Juego real" allow="fullscreen 'none'"></iframe>
<script>
const params=new URLSearchParams(location.search),games={jack:'jack',groove:'groove-ninja',arena:'arena',solo:'arena-solo',chase:'pilla-pilla'},sizes={phone:[390,844],compact:[320,568],wide:[844,390]};
const game=Object.hasOwn(games,params.get('game'))?params.get('game'):'jack',size=Object.hasOwn(sizes,params.get('size'))?params.get('size'):'phone';
document.querySelector('[name=game]').value=game;document.querySelector('[name=size]').value=size;
const frame=document.querySelector('iframe');frame.width=sizes[size][0];frame.height=sizes[size][1];frame.src='/test?seccion=arcade&juego='+games[game];
</script></html>
